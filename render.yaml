services:
  - type: web
    name: reelforge
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: QUEUE_BACKEND
        value: local
      # One encode at a time: two parallel FFmpeg jobs OOM-kill the 512 MB
      # free instance and lose the whole in-memory job.
      - key: WORKER_COUNT
        value: "1"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      # 648x1152 instead of 1080x1920: roughly a third of the pixels to
      # encode. Measured on a 512 MB container, a 40s reel peaks at ~281 MB
      # here versus an OOM-kill at 720x1280 (~474 MB). Raise to 1080x1920 on
      # a paid instance.
      - key: VIDEO_WIDTH
        value: "648"
      - key: VIDEO_HEIGHT
        value: "1152"
      - key: VIDEO_FPS
        value: "30"
      # Hard cuts instead of cross-dissolves. xfade decodes every scene at
      # once and is the memory peak that OOM-kills a 512 MB instance; concat
      # streams them one after another. Set to 0.6 on a paid instance.
      - key: VIDEO_TRANSITION
        value: "0"
      - key: FFMPEG_PRESET
        value: veryfast
      - key: FFMPEG_THREADS
        value: "1"
